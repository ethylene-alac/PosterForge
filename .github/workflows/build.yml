name: Build rootless deb
on:
  workflow_dispatch:
    inputs:
      publish_apt_repository:
        description: Publish this build to the public gh-pages APT repository
        type: boolean
        default: false
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests (real Objective-C scanner and ZIP importer)
        run: |
          set -euo pipefail
          mkdir -p build
          plutil -lint Entitlements.plist Preferences/Resources/Info.plist layout/Library/LaunchDaemons/com.posterforge.daemon.plist layout/Library/PreferenceLoader/Preferences/PosterForge.plist
          sh Tests/run-host-tests.sh 2>&1 | tee build/host-tests.log
      - name: Install Theos
        run: |
          brew install ldid make xz dpkg
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
      - name: Build
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          mkdir -p build
          {
            git rev-parse HEAD
            git -C "$THEOS" rev-parse HEAD
            git -C "$THEOS" submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } > build/toolchain.txt
          gmake clean
          gmake package FINALPACKAGE=1 ARCHS="arm64 arm64e" TARGET=iphone:clang:latest:16.0 THEOS_PACKAGE_SCHEME=rootless 2>&1 | tee build/build.log
      - name: Verify package layout, architectures and signed entitlements
        run: |
          set -euo pipefail
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "$deb" Version)" = 0.1.1
          mkdir -p build/package
          dpkg-deb -x "$deb" build/package
          dpkg-deb -e "$deb" build/package-control
          python3 Tests/verify_package.py build/package build/package-control
          daemon=build/package/var/jb/usr/libexec/posterforged
          prefs=build/package/var/jb/Library/PreferenceBundles/PosterForgePrefs.bundle/PosterForgePrefs
          for binary in "$daemon" "$prefs"; do
            xcrun lipo -verify_arch arm64 arm64e "$binary"
            for arch in arm64 arm64e; do
              xcrun lipo "$binary" -thin "$arch" -output "build/$(basename "$binary")-$arch"
              python3 Tests/verify_macho.py "build/$(basename "$binary")-$arch" "$arch"
              xcrun vtool -show-build "build/$(basename "$binary")-$arch" | tee -a build/macho-build-versions.txt
            done
          done
          for arch in arm64 arm64e; do
            ldid -e "build/posterforged-$arch" > "build/entitlements-$arch.plist"
            python3 Tests/verify_entitlements.py "build/entitlements-$arch.plist"
          done
          shasum -a 256 "$deb" > packages/SHA256SUMS
          cp build/toolchain.txt packages/
      - uses: actions/upload-artifact@v4
        with:
          name: PosterForge-0.1.1-rootless
          path: packages/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PosterForge-build-diagnostics
          path: |
            build/*.log
            build/*.txt
            build/entitlements-*.plist
          if-no-files-found: ignore
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_apt_repository
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PosterForge-0.1.1-rootless
          path: packages
      - name: Install APT packaging tools
        run: brew install dpkg
      - name: Create APT repository
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9c Packages > Packages.gz
          bzip2 -9c Packages > Packages.bz2
          cat > Release <<'EOF'
          Origin: PosterForge
          Label: PosterForge
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: Native photo and video wallpapers for iOS 16
          EOF
          cat > index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>PosterForge Repository</title><style>body{font:17px -apple-system,BlinkMacSystemFont,sans-serif;max-width:680px;margin:60px auto;padding:24px;background:#0b0b0d;color:#f5f5f7}a{color:#64a8ff}.card{background:#1c1c1e;border-radius:18px;padding:24px}</style>
          <div class="card"><h1>PosterForge</h1><p>APT repository for Sileo, Zebra and Cydia.</p><p><a href="sileo://source/https://mubixbyte.github.io/PosterForge/">Add to Sileo</a></p><code>https://mubixbyte.github.io/PosterForge/</code></div>
          EOF
      - name: Publish APT repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          force_orphan: true
